name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Localiser le projet
        id: app
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f hex-studio.zip ]; then
            unzip -q hex-studio.zip -d projet
            echo "dir=projet/hex-studio" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Ni package.json ni hex-studio.zip à la racine du dépôt."
            exit 1
          fi

      - name: Installer les dépendances
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run typecheck

      - name: Tests
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm test

      - name: Build de l'éditeur
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run build

      - name: Test de bout en bout (publication statique)
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          CI_EXPORTS_DIR: ${{ github.workspace }}/${{ steps.app.outputs.dir }}/exports
        run: npm run test:e2e

      - name: Publier le site statique généré
        uses: actions/upload-artifact@v4
        with:
          name: hex-studio-site-exemple
          path: ${{ steps.app.outputs.dir }}/exports/
          if-no-files-found: warn
