name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Localiser le projet
        id: app
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f hex-studio.zip ]; then
            unzip -q hex-studio.zip -d projet
            echo "dir=projet/hex-studio" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Ni package.json ni hex-studio.zip à la racine du dépôt."
            exit 1
          fi

      - name: Installer les dépendances
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run typecheck

      - name: Tests
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm test

      - name: Build de l'éditeur
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run build

      - name: Test de bout en bout (génère le site statique)
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          CI_EXPORTS_DIR: ${{ github.workspace }}/${{ steps.app.outputs.dir }}/exports
        run: npm run test:e2e

      - name: Publier le site statique
        uses: actions/upload-artifact@v4
        with:
          name: hex-studio-site-exemple
          path: ${{ steps.app.outputs.dir }}/exports/
          if-no-files-found: warn

      - name: Fabriquer l'APK (le site dans une application Android)
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          SITE="$(ls -d exports/*/ | head -1)"
          echo "Site embarqué : $SITE"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          mkdir android-app && cd android-app
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          mkdir www && cp -r "../$SITE". www/
          npx cap init "Hex Studio" com.hexstudio.app --web-dir=www
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK (téléchargement direct)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            android-app/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Hex Studio - build ${{ github.run_number }}" \
            --notes "APK de test, à installer directement sur le téléphone." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: hex-studio-apk
          path: ${{ steps.app.outputs.dir }}/android-app/android/app/build/outputs/apk/debug/*.apk
